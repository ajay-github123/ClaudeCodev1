<title>Eyewear Checkout Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow checkout column; a cart strip on top, one step card below it. */
:root {
  --bg: #f3f6f7; --surface: #ffffff; --fg: #142028; --muted: #5b6b74;
  --line: #d6dee2; --accent: #0b6e6e; --accent-ink: #ffffff;
  --error: #b42318; --ok: #1a7f4b; --soft: #e5efef;
  --display: "Fraunces", Georgia, serif;
  --body: "Public Sans", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1619; --surface: #172126; --fg: #e4ecef; --muted: #93a4ac;
  --line: #2a3a41; --accent: #4fc1bd; --accent-ink: #062120;
  --error: #f97066; --ok: #4ac98a; --soft: #1d2d31; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1619; --surface: #172126; --fg: #e4ecef; --muted: #93a4ac;
  --line: #2a3a41; --accent: #4fc1bd; --accent-ink: #062120;
  --error: #f97066; --ok: #4ac98a; --soft: #1d2d31; color-scheme: dark }

body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body); }
.wrap { max-width: 560px; margin: 0 auto; padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 16px; }
h1 { font: 600 1.6rem/1.2 var(--display); margin: 0; text-wrap: balance; }
h2 { font: 600 1.25rem/1.25 var(--display); margin: 0; text-wrap: balance; }
.eyebrow { font: 500 .72rem var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.cart { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.cart b { font-variant-numeric: tabular-nums; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 20px; display: grid; gap: 16px; }
.choices { display: grid; gap: 12px; }
.choice { text-align: left; font: inherit; color: inherit; background: var(--soft);
  border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; cursor: pointer; display: grid; gap: 2px; }
.choice:hover { border-color: var(--accent); }
.choice strong { font-size: 1rem; }
.choice span { color: var(--muted); font-size: .9rem; }
table.rx { width: 100%; border-collapse: collapse; }
.rx th { font: 500 .72rem var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 0 6px 6px 0; }
.rx td { padding: 0 6px 10px 0; vertical-align: top; }
.rx td:first-child { font-weight: 600; padding-top: 8px; white-space: nowrap; }
.field { display: grid; gap: 4px; }
label { font-weight: 500; font-size: .9rem; }
input, select { font: 15px var(--mono); color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; box-sizing: border-box; min-width: 0; }
input[aria-invalid="true"], select[aria-invalid="true"] { border-color: var(--error); }
.err { color: var(--error); font-size: .82rem; min-height: 0; }
.hint { color: var(--muted); font-size: .85rem; }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.row > * { flex: 1 1 140px; min-width: 0; }
.seg { display: flex; gap: 8px; flex-wrap: wrap; }
.seg label { display: flex; gap: 6px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer; font-weight: 500; }
.seg input { width: auto; }
.actions { display: flex; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
button.primary, button.ghost { font: 600 15px var(--body); border-radius: 8px; padding: 10px 16px; cursor: pointer; }
button.primary { background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent); }
button.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
button:focus-visible, input:focus-visible, select:focus-visible, .choice:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.summary { display: grid; gap: 6px; font-family: var(--mono); font-size: .9rem; }
.summary div { display: flex; justify-content: space-between; gap: 12px; }
.done { border-color: var(--ok); }
.done .id { font: 600 1.3rem var(--mono); color: var(--ok); }
.banner { color: var(--error); font-size: .9rem; }
.hero { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.hero svg { width: 150px; max-width: 40%; height: auto; color: var(--fg); flex: none; }
.cart-item { display: flex; align-items: center; gap: 12px; min-width: 0; }
.thumb { width: 64px; height: 40px; flex: none; border-radius: 8px; background: var(--soft); color: var(--fg); display: grid; place-items: center; }
.thumb svg { width: 52px; height: auto; }
.choice { grid-template-columns: 48px 1fr; align-items: center; column-gap: 14px; }
.choice .icon { grid-row: span 2; width: 48px; height: 48px; color: var(--accent); }
.demo { background: var(--soft); border: 1px dashed var(--accent); border-radius: 8px; padding: 10px 12px; font-size: .88rem; }
.demo code { font-family: var(--mono); }
.methods { display: grid; gap: 8px; }
.methods label { display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; font-weight: 500; }
.methods label:has(input:checked) { border-color: var(--accent); background: var(--soft); }
.methods input { width: auto; }
.methods small { color: var(--muted); font-weight: 400; margin-left: auto; text-align: right; }
.pay-fields { display: grid; gap: 12px; }
button.primary[disabled] { opacity: .6; cursor: progress; }
</style>

<div class="wrap">
  <div class="hero">
    <div>
      <div class="eyebrow">Prototype · eyeglasses checkout</div>
      <h1>Add lenses to your frame</h1>
    </div>
    <svg viewBox="0 0 160 70" role="img" aria-label="Round eyeglasses">
      <!-- temples, rims, bridge, nose pads, lens tint and glare -->
      <path d="M14 30 L3 24 M146 30 L157 24" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/>
      <circle cx="44" cy="38" r="27" fill="var(--accent)" fill-opacity=".14" stroke="currentColor" stroke-width="4"/>
      <circle cx="116" cy="38" r="27" fill="var(--accent)" fill-opacity=".14" stroke="currentColor" stroke-width="4"/>
      <path d="M71 34 Q80 24 89 34" stroke="currentColor" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M68 46 l4 6 M92 46 l-4 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M30 26 A20 20 0 0 1 46 18 M102 26 A20 20 0 0 1 118 18" stroke="var(--surface)" stroke-width="3.5" fill="none" stroke-linecap="round" opacity=".9"/>
    </svg>
  </div>
  <div class="cart" aria-label="Cart">
    <span class="cart-item">
      <span class="thumb"><svg viewBox="0 0 120 48" aria-hidden="true"><path d="M12 20 L3 15 M108 20 L117 15" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle cx="33" cy="26" r="19" fill="var(--accent)" fill-opacity=".18" stroke="currentColor" stroke-width="4"/><circle cx="87" cy="26" r="19" fill="var(--accent)" fill-opacity=".18" stroke="currentColor" stroke-width="4"/><path d="M52 23 Q60 15 68 23" stroke="currentColor" stroke-width="3.5" fill="none"/></svg></span>
      <span>Round titanium frame, gunmetal<br><span class="hint">+ blue-cut single-vision lenses</span></span>
    </span>
    <b>₹3,500</b>
  </div>
  <main id="screen" class="card" aria-live="polite"></main>
</div>

<script>
const state = { path: null, rx: null, booking: null };
const screen = document.getElementById('screen');

function render(html) { screen.innerHTML = html; screen.classList.remove('done'); }
function money(n) { return '₹' + n.toLocaleString('en-IN'); }
function esc(t) { return String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }
function genId(prefix) { return prefix + '-' + Math.random().toString(36).slice(2, 8).toUpperCase(); }

const ICON_RX = `<svg class="icon" viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
  <rect x="9" y="5" width="30" height="38" rx="3"/><path d="M15 14h18M15 21h12"/>
  <circle cx="19" cy="33" r="5"/><circle cx="31" cy="33" r="5"/><path d="M24 32h2"/></svg>`;
const ICON_CHART = `<svg class="icon" viewBox="0 0 48 48" aria-hidden="true">
  <rect x="8" y="3" width="32" height="42" rx="3" fill="none" stroke="currentColor" stroke-width="2.5"/>
  <text x="24" y="20" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="14" fill="currentColor">E</text>
  <text x="24" y="31" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="8" fill="currentColor">F P</text>
  <text x="24" y="39" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="5" fill="currentColor">T O Z</text></svg>`;

function showFork() {
  state.path = null;
  render(`
    <div class="eyebrow">Step 1 · Your power</div>
    <h2>Do you know your eye power?</h2>
    <div class="choices">
      <button class="choice" id="know">${ICON_RX}<strong>Yes, I know my power</strong><span>Enter it from your prescription</span></button>
      <button class="choice" id="dontknow">${ICON_CHART}<strong>No, I don't know it</strong><span>Book a free eye test, at home or in a store. We make your lenses after the test.</span></button>
    </div>`);
  document.getElementById('know').onclick = showPowerForm;
  document.getElementById('dontknow').onclick = showBookingForm;
}

/* ---------- Path A: I know my power ---------- */
function eyeRow(eye, label) {
  return `<tr>
    <td>${label}</td>
    <td><input id="${eye}-sph" inputmode="decimal"><div class="err" id="${eye}-sph-err"></div></td>
    <td><input id="${eye}-cyl" inputmode="decimal"><div class="err" id="${eye}-cyl-err"></div></td>
    <td><input id="${eye}-axis" inputmode="numeric"><div class="err" id="${eye}-axis-err"></div></td>
  </tr>`;
}

function showPowerForm() {
  state.path = 'know';
  render(`
    <div class="eyebrow">Step 2 · Your prescription</div>
    <h2>Enter your eye power</h2>
    <p class="hint">Copy the numbers from your prescription. SPH and CYL are in steps of 0.25. Enter 0 for SPH if an eye has no power. Leave CYL and Axis empty if your prescription doesn't list them.</p>
    <form id="rx-form" novalidate>
      <table class="rx">
        <thead><tr><th></th><th>SPH</th><th>CYL</th><th>Axis</th></tr></thead>
        <tbody>${eyeRow('r', 'Right (OD)')}${eyeRow('l', 'Left (OS)')}</tbody>
      </table>
      <div class="banner" id="rx-banner"></div>
      <div class="actions">
        <button type="button" class="ghost" id="back">Back</button>
        <button type="submit" class="primary">Review order</button>
      </div>
    </form>`);
  document.getElementById('back').onclick = showFork;
  document.getElementById('rx-form').onsubmit = (e) => { e.preventDefault(); submitPower(); };
}

function setErr(id, msg) {
  document.getElementById(id + '-err').textContent = msg || '';
  document.getElementById(id).setAttribute('aria-invalid', msg ? 'true' : 'false');
}

// Strict parse: parseFloat('-1.25abc') returns -1.25, so it would let junk through.
const NUM = /^[+-]?(\d+(\.\d*)?|\.\d+)$/;
function checkPower(value, min, max) {
  value = value.trim();
  if (!value) return { error: 'Required' };
  if (!NUM.test(value)) return { error: 'Enter a number like -1.25' };
  const n = Number(value);
  if (n < min || n > max) return { error: `Must be between ${min} and ${max}` };
  if (Math.round(n * 4) !== n * 4) return { error: 'Use steps of 0.25' };
  return { value: n };
}

function submitPower() {
  const rx = {};
  let ok = true;
  for (const eye of ['r', 'l']) {
    const sph = checkPower(document.getElementById(eye + '-sph').value, -20, 20);
    setErr(eye + '-sph', sph.error);
    if (sph.error) ok = false;

    const cylRaw = document.getElementById(eye + '-cyl').value.trim();
    let cyl = { value: 0 };
    if (cylRaw) { cyl = checkPower(cylRaw, -6, 6); }
    setErr(eye + '-cyl', cyl.error);
    if (cyl.error) ok = false;

    // Axis and CYL go together: a cylinder without an axis can't be made,
    // and an axis without a cylinder means a field was mistyped.
    const axisRaw = document.getElementById(eye + '-axis').value.trim();
    const hasCyl = !cyl.error && cyl.value !== 0;
    let axis = { value: null };
    if (hasCyl && !axisRaw) axis = { error: 'Required when CYL is set' };
    else if (!hasCyl && axisRaw && !cyl.error) axis = { error: 'Only used when CYL is set' };
    else if (axisRaw) {
      const a = Number(axisRaw);
      axis = (/^\d{1,3}$/.test(axisRaw) && a >= 1 && a <= 180) ? { value: a } : { error: 'Whole number, 1 to 180' };
    }
    setErr(eye + '-axis', axis.error);
    if (axis.error) ok = false;

    rx[eye] = { sph: sph.value, cyl: cyl.value, axis: axis.value };
  }
  document.getElementById('rx-banner').textContent = ok ? '' : 'Fix the highlighted fields to continue.';
  if (!ok) return;
  state.rx = rx;
  showReview();
}

function fmt(n) { return (n > 0 ? '+' : '') + n.toFixed(2); }
function rxLine(e) { return `SPH ${fmt(e.sph)}  CYL ${fmt(e.cyl)}${e.axis ? '  × ' + e.axis : ''}`; }

function showReview() {
  render(`
    <div class="eyebrow">Step 3 · Review</div>
    <h2>Check your order</h2>
    <div class="summary">
      <div><span>Right (OD)</span><span>${rxLine(state.rx.r)}</span></div>
      <div><span>Left (OS)</span><span>${rxLine(state.rx.l)}</span></div>
      <div><span>Total</span><span>${money(3500)}</span></div>
    </div>
    <div class="actions">
      <button class="ghost" id="edit">Edit power</button>
      <button class="primary" id="place">Continue to payment</button>
    </div>`);
  document.getElementById('edit').onclick = showPowerForm;
  document.getElementById('place').onclick = () => showPayment({
    step: 4, back: showReview,
    done: pay => showDone({
      title: 'Order placed',
      id: genId('ORD'),
      lines: [['Right (OD)', rxLine(state.rx.r)], ['Left (OS)', rxLine(state.rx.l)], ...pay],
      note: 'Your lenses go into production today. Delivery in 5 to 7 days.'
    })
  });
}

/* ---------- Path B: I don't know my power ---------- */
const SLOTS = ['10:00–12:00', '12:00–14:00', '14:00–16:00', '16:00–18:00', '18:00–20:00'];
// Local date, not toISOString(): in IST before 05:30 the UTC date is still yesterday.
function isoDate(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }

function showBookingForm() {
  state.path = 'dontknow';
  const today = new Date();
  const max = new Date(); max.setDate(today.getDate() + 14);
  render(`
    <div class="eyebrow">Step 2 · Free eye test</div>
    <h2>Book your eye test</h2>
    <p class="hint">An optometrist checks your power. Your order is held and lenses are made after the test.</p>
    <form id="bk-form" novalidate class="card" style="border:0;padding:0">
      <div class="seg" role="radiogroup" aria-label="Where">
        <label><input type="radio" name="mode" value="home" checked> At home</label>
        <label><input type="radio" name="mode" value="store"> In a store</label>
      </div>
      <div class="row">
        <div class="field"><label for="pin">Pincode</label><input id="pin" inputmode="numeric" placeholder="560034"><div class="err" id="pin-err"></div></div>
        <div class="field"><label for="date">Date</label><input id="date" type="date" min="${isoDate(today)}" max="${isoDate(max)}"><div class="err" id="date-err"></div></div>
      </div>
      <div class="field"><label for="slot">Time slot</label>
        <select id="slot"><option value="">Choose a slot</option>${SLOTS.map(s => `<option>${s}</option>`).join('')}</select>
        <div class="err" id="slot-err"></div></div>
      <div class="row">
        <div class="field"><label for="name">Name</label><input id="name" autocomplete="name" placeholder="Priya Sharma"><div class="err" id="name-err"></div></div>
        <div class="field"><label for="phone">Mobile</label><input id="phone" inputmode="tel" placeholder="98765 43210"><div class="err" id="phone-err"></div></div>
      </div>
      <div class="banner" id="bk-banner"></div>
      <div class="actions">
        <button type="button" class="ghost" id="back">Back</button>
        <button type="submit" class="primary">Continue to payment</button>
      </div>
    </form>`);
  document.getElementById('back').onclick = showFork;
  document.getElementById('bk-form').onsubmit = (e) => { e.preventDefault(); submitBooking(); };
}

function submitBooking() {
  const v = id => document.getElementById(id).value;
  let ok = true;
  const pin = v('pin');
  const pinErr = /^[1-9][0-9]{5}$/.test(pin) ? '' : 'Enter a 6-digit pincode';
  setErr('pin', pinErr); if (pinErr) ok = false;

  // The input's min/max don't block submission under novalidate, so check the range here.
  const date = v('date');
  const f = document.getElementById('date');
  const dateErr = !date ? 'Pick a date' : (date < f.min || date > f.max) ? 'Pick a date in the next 14 days' : '';
  setErr('date', dateErr); if (dateErr) ok = false;

  const slotErr = v('slot') ? '' : 'Pick a time slot';
  setErr('slot', slotErr); if (slotErr) ok = false;

  const name = v('name').trim();
  const nameErr = name ? '' : 'Enter your name';
  setErr('name', nameErr); if (nameErr) ok = false;

  const phone = v('phone').replace(/[\s-]/g, '').replace(/^(\+91|0)/, '');
  const phoneErr = /^[6-9][0-9]{9}$/.test(phone) ? '' : 'Enter a 10-digit mobile number';
  setErr('phone', phoneErr); if (phoneErr) ok = false;

  document.getElementById('bk-banner').textContent = ok ? '' : 'Fix the highlighted fields to continue.';
  if (!ok) return;
  const mode = document.querySelector('input[name=mode]:checked').value;
  const booking = [
    ['Where', mode === 'home' ? 'At home, ' + pin : 'Nearest store to ' + pin],
    ['When', date + ', ' + v('slot')],
    ['Name', name],
    ['Mobile', phone]
  ];
  showPayment({
    step: 3, back: showBookingForm, payLater: true,
    done: pay => showDone({
      title: 'Eye test booked, order placed',
      id: genId('BKG'),
      lines: [...booking, ...pay],
      note: 'We will text you a reminder the day before. Lenses are made from the power measured at your test.'
    })
  });
}

/* ---------- Payment (demo: nothing is charged or sent anywhere) ---------- */
// Luhn checksum catches most mistyped card numbers.
function luhn(num) {
  let sum = 0;
  for (let i = 0; i < num.length; i++) {
    let d = Number(num[num.length - 1 - i]);
    if (i % 2) { d *= 2; if (d > 9) d -= 9; }
    sum += d;
  }
  return sum % 10 === 0;
}
function cardBrand(num) {
  if (/^4/.test(num)) return 'Visa';
  if (/^(5[1-5]|2[2-7])/.test(num)) return 'Mastercard';
  if (/^(60|65|81|82|508)/.test(num)) return 'RuPay';
  if (/^3[47]/.test(num)) return 'Amex';
  return 'Card';
}

function showPayment({ step, back, done, payLater }) {
  render(`
    <div class="eyebrow">Step ${step} · Payment</div>
    <h2>Pay ${money(3500)}</h2>
    <div class="demo"><strong>Demo checkout.</strong> No money is charged and nothing leaves this page. Don't enter a real card. For a test card use <code>4111 1111 1111 1111</code>, any future expiry, any 3-digit CVV.</div>
    <form id="pay-form" novalidate class="card" style="border:0;padding:0">
      <div class="methods" role="radiogroup" aria-label="Payment method">
        <label><input type="radio" name="method" value="upi" checked> UPI <small>GPay, PhonePe, Paytm</small></label>
        <label><input type="radio" name="method" value="card"> Credit or debit card <small>Visa, Mastercard, RuPay</small></label>
        <label><input type="radio" name="method" value="cod"> Cash on delivery <small>Pay when it arrives</small></label>
        ${payLater ? '<label><input type="radio" name="method" value="later"> Pay after your eye test <small>Order held until then</small></label>' : ''}
      </div>
      <div class="pay-fields" id="f-upi">
        <div class="field"><label for="vpa">UPI ID</label><input id="vpa" autocomplete="off" placeholder="yourname@okbank"><div class="err" id="vpa-err"></div></div>
      </div>
      <div class="pay-fields" id="f-card" hidden>
        <div class="field"><label for="cc">Card number</label><input id="cc" inputmode="numeric" autocomplete="off"><div class="err" id="cc-err"></div></div>
        <div class="row">
          <div class="field"><label for="exp">Expiry (MM/YY)</label><input id="exp" inputmode="numeric" autocomplete="off"><div class="err" id="exp-err"></div></div>
          <div class="field"><label for="cvv">CVV</label><input id="cvv" inputmode="numeric" autocomplete="off" type="password"><div class="err" id="cvv-err"></div></div>
        </div>
        <div class="field"><label for="ccname">Name on card</label><input id="ccname" autocomplete="off"><div class="err" id="ccname-err"></div></div>
      </div>
      <div class="banner" id="pay-banner"></div>
      <div class="actions">
        <button type="button" class="ghost" id="back">Back</button>
        <button type="submit" class="primary" id="pay-btn">Pay ${money(3500)}</button>
      </div>
    </form>`);
  const method = () => document.querySelector('input[name=method]:checked').value;
  const sync = () => {
    const m = method();
    document.getElementById('f-upi').hidden = m !== 'upi';
    document.getElementById('f-card').hidden = m !== 'card';
    document.getElementById('pay-btn').textContent =
      m === 'cod' || m === 'later' ? 'Place order' : 'Pay ' + money(3500);
  };
  document.querySelectorAll('input[name=method]').forEach(r => r.onchange = sync);
  document.getElementById('back').onclick = back;
  document.getElementById('pay-form').onsubmit = (e) => {
    e.preventDefault();
    const pay = checkPayment(method());
    document.getElementById('pay-banner').textContent = pay ? '' : 'Fix the highlighted fields to continue.';
    if (!pay) return;
    // Stand-in for the payment gateway round trip.
    const btn = document.getElementById('pay-btn');
    btn.disabled = true; btn.textContent = 'Processing…';
    setTimeout(() => done(pay), 900);
  };
}

// Returns summary lines for the confirmation, or null if a field is invalid.
function checkPayment(m) {
  const v = id => document.getElementById(id).value.trim();
  if (m === 'cod') return [['Payment', 'Cash on delivery, ' + money(3500)]];
  if (m === 'later') return [['Payment', money(3500) + ' due after the eye test']];
  if (m === 'upi') {
    const vpa = v('vpa');
    const err = /^[a-z0-9._-]{2,256}@[a-z]{2,64}$/i.test(vpa) ? '' : 'Enter a UPI ID like name@okbank';
    setErr('vpa', err);
    return err ? null : [['Paid', money(3500) + ' via UPI (' + vpa + ')']];
  }
  let ok = true;
  const num = v('cc').replace(/[\s-]/g, '');
  const ccErr = !/^\d{13,19}$/.test(num) ? 'Enter the 13 to 19 digits on your card'
    : !luhn(num) ? 'This card number isn\'t valid. Check for a typo' : '';
  setErr('cc', ccErr); if (ccErr) ok = false;

  const exp = v('exp').match(/^(\d{2})\s*\/\s*(\d{2})$/);
  let expErr = exp ? '' : 'Use MM/YY, like 08/28';
  if (exp) {
    const mm = Number(exp[1]), yy = 2000 + Number(exp[2]);
    const now = new Date();
    if (mm < 1 || mm > 12) expErr = 'Month must be 01 to 12';
    else if (yy < now.getFullYear() || (yy === now.getFullYear() && mm < now.getMonth() + 1)) expErr = 'This card has expired';
  }
  setErr('exp', expErr); if (expErr) ok = false;

  const cvvErr = /^\d{3,4}$/.test(v('cvv')) ? '' : 'Enter the 3 or 4 digits on the back';
  setErr('cvv', cvvErr); if (cvvErr) ok = false;

  const nameErr = v('ccname') ? '' : 'Enter the name on the card';
  setErr('ccname', nameErr); if (nameErr) ok = false;

  return ok ? [['Paid', money(3500) + ' by ' + cardBrand(num) + ' •••• ' + num.slice(-4)]] : null;
}

/* ---------- Confirmation ---------- */
function showDone({ title, id, lines, note }) {
  render(`
    <div class="eyebrow">Confirmed</div>
    <h2>${title}</h2>
    <div class="id" id="confirm-id">${id}</div>
    <div class="summary">${lines.map(([k, v]) => `<div><span>${k}</span><span>${esc(v)}</span></div>`).join('')}</div>
    <p class="hint">${note}</p>
    <div class="actions"><span></span><button class="ghost" id="restart">Start again</button></div>`);
  screen.classList.add('done');
  document.getElementById('restart').onclick = showFork;
}

showFork();
</script>
